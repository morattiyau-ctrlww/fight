<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>照片大魔王 · 上中下对决</title>
<style>
/* ==========================================================================
   极简版：画面里只留「大魔王（照片）」和「英雄（小人）」
   上 / 中 / 下 的选择键就贴在英雄旁边，动画播放时自动收起
   ========================================================================== */
:root{
  --ink:#e9f0ff;
  --dim:#8fa1c7;
  --cyan:#57e6ff;
  --blue:#4d8dff;
  --red:#ff4757;
  --gold:#ffd166;
  --heroW:clamp(58px,13vw,76px);
  --heroH:clamp(104px,23vw,140px);
  --stageH:clamp(180px,42vw,220px);
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--font);letter-spacing:.02em;overflow:hidden;
  background:radial-gradient(120% 80% at 50% -10%,#1a2450 0%,#0b1020 48%,#05070f 100%);
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;mix-blend-mode:screen}
.bg::before{width:52vw;height:52vw;left:-14vw;top:-18vw;background:radial-gradient(circle at 50% 50%,#2b6bff,#0b1a4d 70%)}
.bg::after{width:46vw;height:46vw;right:-16vw;bottom:-16vw;background:radial-gradient(circle at 50% 50%,#ff2f6d,#4a0b28 70%)}
.bg i{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 30%,rgba(0,0,0,.75) 100%)}

button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;letter-spacing:inherit}
img{display:block;max-width:100%}

/* ---------- 舞台 ---------- */
.app{position:relative;z-index:1;height:100dvh;display:grid;place-items:center;padding:clamp(6px,1.8vh,18px) 12px}
.scene{position:relative;width:min(900px,100%);height:min(560px,90dvh);
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:clamp(8px,2vw,24px)}
.fx-layer{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:visible}

/* ---------- 大魔王（照片） ---------- */
.boss{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;z-index:5;flex:0 0 auto}
.frame{position:relative;border-radius:20px;overflow:hidden;background:#0b1130;
  border:1px solid rgba(170,205,255,.22);
  box-shadow:0 22px 46px rgba(0,0,0,.62),0 0 40px rgba(255,71,87,.10);
  transition:box-shadow .3s ease,border-color .3s ease}
.boss .frame{width:clamp(190px,46vw,290px);aspect-ratio:5/4}
.boss .frame img{width:100%;height:100%;object-fit:cover}
.boss .frame .fallback{position:absolute;inset:0;display:grid;place-items:center;
  font-size:clamp(54px,12vw,94px);filter:drop-shadow(0 10px 20px rgba(0,0,0,.55));
  background:radial-gradient(60% 60% at 50% 42%,rgba(255,71,87,.34),transparent 72%)}
.boss .frame .fallback.hidden{display:none}
.frame .tint{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(70% 70% at 50% 45%,rgba(255,40,70,.6),rgba(255,40,70,.1))}
.boss .frame.hurt{animation:frameHurt .62s cubic-bezier(.36,.07,.19,.97) both}
.boss .frame.hurt .tint{animation:tintFlash .62s ease-out both}
.boss .frame.charging{border-color:rgba(255,71,87,.95);
  animation:bossCharge 1s ease-in-out infinite}
@keyframes bossCharge{
  0%,100%{box-shadow:0 0 0 2px rgba(255,71,87,.3),0 0 30px rgba(255,71,87,.5)}
  50%{box-shadow:0 0 0 5px rgba(255,71,87,.55),0 0 70px rgba(255,71,87,.95)}
}
.boss .frame.dive{animation:bossDive .74s cubic-bezier(.35,.05,.35,1) both}
@keyframes bossDive{
  0%{transform:translate(0,0) scale(1)}
  14%{transform:translate(0,-8px) scale(1.03)}
  44%,58%{transform:translate(var(--dx),var(--dy)) scale(1.07) rotate(-2deg)}
  100%{transform:translate(0,0) scale(1)}
}
@keyframes frameHurt{
  0%,100%{transform:rotate(0) translate(0,0)}
  12%{transform:rotate(-4deg) translate(-7px,3px)}
  30%{transform:rotate(4deg) translate(7px,-2px)}
  48%{transform:rotate(-2.5deg) translate(-5px,2px)}
  68%{transform:rotate(1.5deg) translate(3px,-1px)}
}
@keyframes tintFlash{0%,100%{opacity:0}14%{opacity:1}60%{opacity:.35}}
/* ---------- 血条（极简） ---------- */
.hp{display:flex;align-items:center;gap:8px}
.hp .bar{position:relative;width:clamp(118px,32vw,188px);height:9px;border-radius:99px;overflow:hidden;
  background:rgba(6,10,26,.9);border:1px solid rgba(160,190,255,.2)}
.hp .bar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,#2fbf6b,#6ef2a4);box-shadow:0 0 12px rgba(61,220,132,.5);
  transition:width .55s cubic-bezier(.22,1,.36,1),background .3s ease,box-shadow .3s ease}
.hp.warn .bar i{background:linear-gradient(90deg,#e8a020,#ffd166);box-shadow:0 0 12px rgba(255,209,102,.5)}
.hp.crit .bar i{background:linear-gradient(90deg,#c81e2d,#ff6b78);box-shadow:0 0 14px rgba(255,71,87,.7);animation:critPulse 1s ease-in-out infinite}
@keyframes critPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
.hp b{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--dim);min-width:30px}
.hp b em{font-style:normal;font-size:15px;color:var(--ink)}

/* ---------- 上 / 中 / 下 三段 ---------- */
.lanes{position:absolute;inset:0;z-index:3;display:grid;grid-template-rows:repeat(3,1fr)}
.lane{position:relative;border-bottom:1px dashed rgba(170,205,255,.15)}
.lane:last-child{border-bottom:none}
.lane u{position:absolute;left:4px;top:50%;transform:translateY(-50%);text-decoration:none;
  width:16px;height:16px;border-radius:5px;display:grid;place-items:center;
  font-size:10px;font-weight:800;color:rgba(214,232,255,.62);
  background:rgba(6,10,26,.5);border:1px solid rgba(170,205,255,.18);
  transition:background .2s ease,color .2s ease,border-color .2s ease}
.lane.hit{animation:laneHit .8s ease-out}
.lane.hit u{background:rgba(255,71,87,.85);border-color:#ffc2c8;color:#fff}
.lane.blocked{animation:laneBlock .85s ease-out}
.lane.blocked u{background:rgba(77,141,255,.9);border-color:#c8e0ff;color:#fff}
.lane.ping{animation:lanePing .8s ease-out}
.lane.telegraph{animation:laneTelegraph 1s ease-in-out infinite}
.lane.telegraph u{background:rgba(255,71,87,.9);border-color:#ffd9dd;color:#fff;
  box-shadow:0 0 14px rgba(255,71,87,.9)}
@keyframes laneTelegraph{
  0%,100%{background:rgba(255,71,87,.06);box-shadow:inset 0 0 0 rgba(255,71,87,0)}
  50%{background:rgba(255,71,87,.34);box-shadow:inset 0 0 40px rgba(255,71,87,.75)}
}
@keyframes laneHit{
  0%{background:rgba(255,71,87,0);box-shadow:inset 0 0 0 rgba(255,71,87,0)}
  14%{background:rgba(255,71,87,.6);box-shadow:inset 0 0 46px rgba(255,71,87,.95)}
  100%{background:rgba(255,71,87,0);box-shadow:inset 0 0 0 rgba(255,71,87,0)}
}
@keyframes laneBlock{
  0%{background:rgba(77,141,255,0);box-shadow:inset 0 0 0 rgba(120,190,255,0)}
  18%{background:rgba(77,141,255,.42);box-shadow:inset 0 0 38px rgba(150,210,255,.85)}
  100%{background:rgba(77,141,255,0);box-shadow:inset 0 0 0 rgba(120,190,255,0)}
}
@keyframes lanePing{
  0%{background:rgba(120,190,255,.32);box-shadow:inset 0 0 26px rgba(150,210,255,.6)}
  100%{background:rgba(120,190,255,0);box-shadow:inset 0 0 0 rgba(120,190,255,0)}
}
/* ---------- 英雄（小全身） ---------- */
.hero-block{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;z-index:5;flex:0 0 auto}
.hero-row{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.6vw,18px);z-index:5}
.hero-stage{position:relative;width:clamp(140px,32vw,196px);height:var(--stageH,220px)}
.rise{position:absolute;left:50%;bottom:50%;width:var(--heroW,44px);height:var(--heroH,84px);
  margin-left:calc(var(--heroW,44px) / -2);margin-bottom:calc(var(--heroH,84px) / -2);z-index:4;
  transform:translateY(var(--lane,0px));
  transition:transform .22s cubic-bezier(.2,1,.3,1)}
.hero{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.rise.idle .hero{animation:heroIdle 2.6s ease-in-out infinite}
@keyframes heroIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hero .h-sword{transform-origin:38.25px 44px;transform:rotate(14deg)}
.hero .h-arm-r{transform-origin:38.25px 30px}
.hero .h-arm-l{transform-origin:9.75px 30px}
.hero .h-cape-l{transform-origin:13px 28px}
.hero .h-cape-r{transform-origin:35px 28px}
.hero .h-body{transform-origin:24px 50px}
.hero-shield{position:absolute;left:50%;top:-16px;margin-left:-19px;width:38px;font-size:33px;line-height:1;
  opacity:0;transform:scale(.4)}
.hero-flash{position:absolute;left:50%;top:50%;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,60,84,.85),rgba(255,60,84,0) 66%);opacity:0;pointer-events:none;z-index:3}

.rise.dash{animation:heroDash .78s cubic-bezier(.34,.06,.36,1) both}
.rise.dash .h-sword{animation:swordSwing .78s cubic-bezier(.3,.7,.3,1) both}
.rise.dash .h-arm-r{animation:armSwingRight .78s ease-in-out both}
.rise.dash .h-arm-l{animation:armSwingLeft .78s ease-in-out both}
.rise.dash .hero{animation:heroLean .78s ease-in-out both}
.rise.hurt{animation:heroHurt .66s cubic-bezier(.36,.07,.19,.97) both}
.rise.hurt .hero{animation:hurtFlash .66s ease-out both}
.rise.hurt .hero-flash{animation:hurtGlow .66s ease-out both}
.rise.guard{animation:heroGuard .6s ease-in-out both}
.rise.guard .hero-shield{opacity:1;animation:shieldUp .6s cubic-bezier(.2,1.3,.4,1) both}
.rise.guard .h-sword{transform:rotate(26deg)}

@keyframes heroDash{
  0%{transform:translateY(var(--lane,0)) translate(0,0) scale(1) rotate(0)}
  12%{transform:translateY(var(--lane,0)) translate(calc(var(--dx) * .05),calc(var(--dy) * .05 + 7px)) scale(.94)}
  42%{transform:translateY(var(--lane,0)) translate(calc(var(--dx) * .78),calc(var(--dy) * .78)) scale(1.06) rotate(-5deg)}
  50%,58%{transform:translateY(var(--lane,0)) translate(var(--dx),var(--dy)) scale(1.09) rotate(7deg)}
  100%{transform:translateY(var(--lane,0)) translate(0,0) scale(1) rotate(0)}
}
@keyframes heroLean{
  0%,100%{transform:rotate(0)}
  45%{transform:rotate(-9deg)}
  56%{transform:rotate(11deg)}
  72%{transform:rotate(3deg)}
}
@keyframes swordSwing{
  0%{transform:rotate(14deg)}
  16%{transform:rotate(86deg)}
  44%{transform:rotate(-92deg)}
  62%{transform:rotate(-64deg)}
  100%{transform:rotate(14deg)}
}
@keyframes armSwingRight{
  0%,100%{transform:rotate(0)}
  16%{transform:rotate(26deg)}
  44%{transform:rotate(-32deg)}
}
@keyframes armSwingLeft{
  0%,100%{transform:rotate(0)}
  20%{transform:rotate(-18deg)}
  46%{transform:rotate(22deg)}
}
@keyframes heroHurt{
  0%{transform:translateY(var(--lane,0)) translate(0,0) rotate(0)}
  14%{transform:translateY(var(--lane,0)) translate(-7px,12px) rotate(-7deg) scale(.97)}
  36%{transform:translateY(var(--lane,0)) translate(6px,17px) rotate(6deg) scale(.95)}
  58%{transform:translateY(var(--lane,0)) translate(-3px,11px) rotate(-3deg) scale(.97)}
  100%{transform:translateY(var(--lane,0)) translate(0,0) rotate(0) scale(1)}
}
@keyframes hurtFlash{
  0%,100%{filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
  12%{filter:brightness(2.5) saturate(1.5) drop-shadow(0 0 14px rgba(255,60,84,.95))}
  55%{filter:brightness(1.15) saturate(1.25) drop-shadow(0 0 8px rgba(255,60,84,.6))}
}
@keyframes hurtGlow{0%,100%{opacity:0}12%{opacity:1}55%{opacity:.45}}
@keyframes heroGuard{
  0%{transform:translateY(var(--lane,0)) translate(0,0) scale(1)}
  30%,72%{transform:translateY(var(--lane,0)) translate(0,6px) scale(1.06,.93)}
  100%{transform:translateY(var(--lane,0)) translate(0,0) scale(1)}
}
@keyframes shieldUp{
  0%{transform:translateY(16px) scale(.35) rotate(-22deg)}
  40%{transform:translateY(0) scale(1.14) rotate(6deg)}
  70%{transform:translateY(-2px) scale(1) rotate(-3deg)}
  100%{transform:translateY(0) scale(1) rotate(0)}
}
/* ---------- 选择键（贴在英雄右边，动画时收起） ---------- */
.hero-side{display:flex;flex-direction:column;align-items:center;gap:9px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);width:var(--stageH,186px);gap:6px;
  opacity:0;transform:translateY(12px) scale(.92);pointer-events:none;
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,1,.3,1)}
.choices.show{opacity:1;transform:none;pointer-events:auto}
.choice{position:relative;height:clamp(52px,13vw,68px);border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:2px solid rgba(170,205,255,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  font-size:clamp(20px,4.6vw,26px);font-weight:900;
  transition:transform .16s ease,box-shadow .22s ease,border-color .22s ease,background .22s ease}
.choice em{font-style:normal;font-size:.85em;opacity:.95}
.choice.atk{border-color:rgba(255,140,120,.75);background:linear-gradient(180deg,rgba(255,120,90,.34),rgba(255,71,87,.1));
  box-shadow:0 0 18px rgba(255,120,90,.35)}
.choice.def{border-color:rgba(120,190,255,.75);background:linear-gradient(180deg,rgba(87,180,255,.34),rgba(77,141,255,.1));
  box-shadow:0 0 18px rgba(87,190,255,.35)}
.choice:hover{transform:translateY(-3px)}
.choice.atk:hover{border-color:var(--gold);box-shadow:0 12px 26px rgba(255,120,90,.3)}
.choice.def:hover{border-color:var(--cyan);box-shadow:0 12px 26px rgba(87,200,255,.3)}
.choice:active{transform:translateY(-1px) scale(.97)}

/* ---------- 回合提示（只在需要时出现） ---------- */
.hint{display:flex;align-items:center;gap:10px;font-size:clamp(17px,3.6vw,22px);font-weight:900;
  letter-spacing:.06em;color:#fff;
  padding:clamp(10px,2vw,14px) clamp(20px,4vw,30px);border-radius:99px;
  border:2px solid rgba(170,205,255,.4);
  background:rgba(10,16,34,.85);backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.55);
  opacity:0;transform:translateY(6px) scale(.9);pointer-events:none;
  transition:opacity .22s ease,transform .22s ease}
.hint.show{opacity:1;transform:none;animation:hintPulse 1.6s ease-in-out infinite}
.hint.def{color:#eaf6ff;border-color:rgba(120,190,255,.85);
  background:linear-gradient(180deg,rgba(77,141,255,.4),rgba(10,16,34,.9));
  box-shadow:0 0 26px rgba(87,190,255,.55),0 10px 30px rgba(0,0,0,.55)}
.hint.atk{color:#fff2e8;border-color:rgba(255,150,120,.85);
  background:linear-gradient(180deg,rgba(255,90,70,.42),rgba(10,16,34,.9));
  box-shadow:0 0 26px rgba(255,120,90,.55),0 10px 30px rgba(0,0,0,.55)}
.hint b{color:#fff}
.hint #hintIco{font-size:1.15em;line-height:1}
@keyframes hintPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* ==========================================================================
   特效层
   ========================================================================== */
.fx{position:absolute;pointer-events:none;will-change:transform,opacity}
.fx-trail{height:3px;border-radius:3px;transform-origin:0 50%;
  background:linear-gradient(90deg,rgba(87,230,255,0),rgba(87,230,255,.9) 55%,#fff);
  box-shadow:0 0 14px rgba(87,230,255,.85),0 0 34px rgba(87,230,255,.4);
  animation:trailFly .55s cubic-bezier(.3,.9,.3,1) forwards}
.fx-trail.enemy{background:linear-gradient(90deg,rgba(255,71,87,0),rgba(255,71,87,.9) 55%,#ffd9dd);
  box-shadow:0 0 14px rgba(255,71,87,.85),0 0 34px rgba(255,71,87,.4)}
@keyframes trailFly{
  0%{opacity:0;transform:rotate(var(--ang)) scaleX(0)}
  25%{opacity:1}
  100%{opacity:0;transform:rotate(var(--ang)) scaleX(1)}
}
.fx-slash{width:120px;height:120px;animation:slashFade .58s ease-out forwards}
.fx-slash i{position:absolute;left:50%;top:50%;width:120px;height:6px;border-radius:99px;
  background:linear-gradient(90deg,transparent,#fff 45%,#9ef0ff 62%,transparent);
  box-shadow:0 0 16px rgba(180,240,255,.95),0 0 40px rgba(87,230,255,.55)}
.fx-slash.hot i{background:linear-gradient(90deg,transparent,#fff 45%,#ff9aa5 62%,transparent);
  box-shadow:0 0 16px rgba(255,180,190,.95),0 0 40px rgba(255,71,87,.55)}
.fx-slash i.a{animation:slashA .52s cubic-bezier(.2,.9,.3,1) forwards}
.fx-slash i.b{animation:slashB .52s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes slashA{0%{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) scaleX(.12)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-38deg) scaleX(1.2)}}
@keyframes slashB{0%{opacity:0;transform:translate(-50%,-50%) rotate(34deg) scaleX(.12)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(34deg) scaleX(1.2)}}
@keyframes slashFade{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.28)}}
.fx-shield{font-size:clamp(30px,4.6vw,44px);line-height:1;animation:shieldPop .9s cubic-bezier(.2,1.4,.4,1) forwards;
  filter:drop-shadow(0 0 16px rgba(120,200,255,.95)) drop-shadow(0 0 38px rgba(77,141,255,.5))}
@keyframes shieldPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-24deg)}
  32%{opacity:1;transform:translate(-50%,-50%) scale(1.22) rotate(6deg)}
  52%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}
}
.fx-ring{width:88px;height:88px;border-radius:50%;border:3px solid rgba(150,215,255,.92);
  box-shadow:0 0 28px rgba(120,200,255,.8),inset 0 0 28px rgba(120,200,255,.5);
  animation:ringExpand .85s ease-out forwards}
@keyframes ringExpand{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.95)}}
.fx-ring.hot{border-color:rgba(255,150,160,.95);box-shadow:0 0 30px rgba(255,71,87,.85)}
.fx-spark{width:7px;height:7px;border-radius:50%;background:#fff;
  box-shadow:0 0 12px #9ef0ff,0 0 24px rgba(87,230,255,.8);
  animation:sparkFly .66s cubic-bezier(.2,.7,.4,1) forwards}
.fx-spark.hot{background:#ffd9dd;box-shadow:0 0 12px #ff9aa5,0 0 24px rgba(255,71,87,.85)}
@keyframes sparkFly{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.25)}
}
.fx-burst{width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#fff,#ffd166 45%,rgba(255,71,87,0));
  animation:burstOut .5s ease-out forwards}
@keyframes burstOut{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(7)}}
.fx-pop{font-size:clamp(19px,3.4vw,27px);font-weight:900;white-space:nowrap;letter-spacing:.06em;
  animation:popRise 1.05s cubic-bezier(.2,.9,.3,1) forwards;text-shadow:0 4px 22px rgba(0,0,0,.85)}
.fx-pop.hit{color:#ff6b78;text-shadow:0 0 20px rgba(255,71,87,.9),0 4px 22px rgba(0,0,0,.8)}
.fx-pop.block{color:#8fd0ff;text-shadow:0 0 20px rgba(87,190,255,.9),0 4px 22px rgba(0,0,0,.8)}
.fx-pop small{display:block;font-size:.46em;letter-spacing:.2em;opacity:.85;font-weight:800;text-align:center}
@keyframes popRise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  24%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  42%{transform:translate(-50%,-50%) scale(1)}
  76%{opacity:1;transform:translate(-50%,-135%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-175%) scale(.95)}
}
.fx-dmg{font-size:clamp(22px,4vw,34px);font-weight:900;color:#ff5c6c;font-variant-numeric:tabular-nums;

/* ---------- 角落小按钮 ---------- */

@keyframes fadeIn{from{opacity:0}to{opacity:1}}

  background:linear-gradient(180deg,rgba(24,34,66,.97),rgba(8,12,28,.99));

@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(80% 50% at 50% -10%,rgba(87,230,255,.2),transparent 70%),

<script>
(function () {
  "use strict";

  /* ====================== 常量 ====================== */
  var MAX_HP = 100;
  var DMG = 15;
  var ZONES = ["top", "mid", "bot"];
  var LANE_Y = { top: -1, mid: 0, bot: 1 };

  /* ====================== DOM ====================== */
  function $(id) { return document.getElementById(id); }
  var scene = $("scene"), fxLayer = $("fxLayer");
  var bossFrame = $("bossFrame"), bossImg = $("bossImg"), bossFallback = $("bossFallback");
  var bossHp = $("bossHp"), bossHpFill = $("bossHpFill"), bossHpText = $("bossHpText");
  var heroHp = $("heroHp"), heroHpFill = $("heroHpFill"), heroHpText = $("heroHpText");
  var heroStage = $("heroStage"), rise = $("rise");
  var choices = $("choices");
  var choiceBtns = Array.prototype.slice.call(choices.querySelectorAll(".choice"));
  var hint = $("hint"), hintIco = $("hintIco"), hintText = $("hintText");
  var screenFlash = $("screenFlash");
  var uploadOverlay = $("uploadOverlay"), dropZone = $("dropZone"), fileInput = $("fileInput");
  var preview = $("preview"), previewImg = $("previewImg"), previewName = $("previewName");
  var btnStart = $("btnStart"), btnDefault = $("btnDefault");
  var btnPhoto = $("btnPhoto"), btnSound = $("btnSound");
  var resultOverlay = $("resultOverlay"), resEmoji = $("resEmoji");
  var resTitle = $("resTitle"), resSub = $("resSub");
  var btnAgain = $("btnAgain"), btnChange = $("btnChange");

  /* ====================== 状态 ====================== */
  var state = {
    phase: "idle",      // idle | attack | defend | over
    busy: false,
    started: false,
    bossHp: MAX_HP,
    heroHp: MAX_HP,
    round: 1,
    hits: 0,
    blocks: 0,
    plan: "mid",        // 大魔王本回合攻击哪一段
    sound: true,
    photoURL: null
  };

  /* ====================== 基础工具 ====================== */
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function pick() { return ZONES[Math.floor(Math.random() * ZONES.length)]; }
  function makeEl(cls) {
    var el = document.createElement("div");
    el.className = cls;
    fxLayer.appendChild(el);
    return el;
  }
  function autoRemove(el, ms) {
    setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, ms);
  }
  function centerOf(el) {
    var r = el.getBoundingClientRect();
    var l = fxLayer.getBoundingClientRect();
    return { x: r.left - l.left + r.width / 2, y: r.top - l.top + r.height / 2 };
  }
  function laneEl(side, zone) {
    return scene.querySelector('.lane[data-side="' + side + '"][data-zone="' + zone + '"]');
  }
  function oneThird() { return heroStage.getBoundingClientRect().height / 3; }

  /* ====================== 特效 ====================== */
  /* 冲刺残影 / 俯冲残影 */
  function trail(from, to, enemy) {
    var dx = to.x - from.x, dy = to.y - from.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var t = makeEl("fx fx-trail" + (enemy ? " enemy" : ""));
    t.style.left = from.x + "px";
    t.style.top = from.y + "px";
    t.style.width = dist + "px";
    t.style.setProperty("--ang", ang + "deg");
    autoRemove(t, 720);
  }
  /* 斩击十字 */
  function slashAt(pt, hot) {
    var s = makeEl("fx fx-slash" + (hot ? " hot" : ""));
    s.style.left = pt.x + "px";
    s.style.top = pt.y + "px";
    s.innerHTML = '<i class="a"></i><i class="b"></i>';
    autoRemove(s, 760);
  }
  /* 火花 / 爆闪 */
  function sparksAt(pt, hot, n) {
    for (var i = 0; i < n; i++) {
      var p = makeEl("fx fx-spark" + (hot ? " hot" : ""));
      p.style.left = pt.x + "px";
      p.style.top = pt.y + "px";
      var a = Math.random() * Math.PI * 2;
      var r = 40 + Math.random() * 92;
      p.style.setProperty("--dx", (Math.cos(a) * r) + "px");
      p.style.setProperty("--dy", (Math.sin(a) * r) + "px");
      autoRemove(p, 820);
    }
  }
  function burstAt(pt) {
    var b = makeEl("fx fx-burst");
    b.style.left = pt.x + "px";
    b.style.top = pt.y + "px";
    autoRemove(b, 620);
  }
  /* 「命中！」「格挡！」 */
  function popAt(pt, main, sub, kind) {
    var p = makeEl("fx fx-pop " + kind);
    p.innerHTML = main + (sub ? "<small>" + sub + "</small>" : "");
    p.style.left = pt.x + "px";
    p.style.top = pt.y + "px";
    autoRemove(p, 1300);
  }
  /* 伤害数字 */
  function dmgAt(pt, text) {
    var d = makeEl("fx fx-dmg");
    d.textContent = text;
    d.style.left = pt.x + "px";
    d.style.top = pt.y + "px";
    autoRemove(d, 1250);
  }
  /* 盾牌（大魔王防守的那一段 / 英雄挡错位置时的提示） */
  function shieldAt(pt, blocked) {
    var s = makeEl("fx fx-shield");
    s.textContent = "🛡️";
    s.style.left = pt.x + "px";
    s.style.top = pt.y + "px";
    if (!blocked) { s.style.opacity = ".75"; s.style.filter = "grayscale(.25)"; }
    autoRemove(s, 1020);
    ringAt(pt, !blocked);
  }
  function ringAt(pt, hot) {
    var r = makeEl("fx fx-ring" + (hot ? " hot" : ""));
    r.style.left = pt.x + "px";
    r.style.top = pt.y + "px";
    autoRemove(r, 920);
  }
  /* 大魔王攻击方向指示：目标段闪烁（攻击动作本身即提示） */
  function showAim(zone) {
    clearAim();
    var lane = laneEl("hero", zone);
    if (lane) lane.classList.add("telegraph");
  }
  function clearAim() {
    ZONES.forEach(function (z) {
      var l = laneEl("hero", z);
      if (l) l.classList.remove("telegraph");
    });
  }
  /* 段位闪光 */
  function markLane(el, cls) {
    if (!el) return;
    el.classList.remove("hit", "blocked", "ping");
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function () { el.classList.remove(cls); }, 900);
  }
  /* 全屏闪光 */
  function flashScreen(kind, where) {
    screenFlash.className = "screen-flash";
    void screenFlash.offsetWidth;
    screenFlash.classList.add(kind);
    if (where) screenFlash.classList.add(where);
  }
  /* ====================== 音效（WebAudio 合成） ====================== */
  var ac = null;
  function audio() {
    try {
      if (!ac) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ac = new C();
      }
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  function tone(o) {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    var t0 = ctx.currentTime + (o.delay || 0), dur = o.dur || 0.2;
    var osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.06);
  }
  function noiseBurst(o) {
    if (!state.sound) return;
    var ctx = audio(); if (!ctx) return;
    var dur = o.dur || 0.3, t0 = ctx.currentTime + (o.delay || 0);
    var len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = ctx.createBufferSource(); src.buffer = buf;
    var bp = ctx.createBiquadFilter();
    bp.type = "bandpass"; bp.Q.value = o.q || 1;
    bp.frequency.setValueAtTime(o.f0 || 800, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(60, o.f1 || o.f0 || 800), t0 + dur);
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(o.vol || 0.18, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0 + dur + 0.05);
  }
  var sfx = {
    click: function () { tone({ freq: 620, to: 900, dur: 0.07, type: "triangle", vol: 0.07 }); },
    whoosh: function () { noiseBurst({ dur: 0.32, f0: 240, f1: 2500, q: 1.3, vol: 0.14 }); },
    hit: function () {
      noiseBurst({ dur: 0.3, f0: 2600, f1: 260, q: 0.9, vol: 0.28 });
      tone({ freq: 190, to: 55, dur: 0.3, type: "sawtooth", vol: 0.16 });
    },
    block: function () {
      tone({ freq: 1180, dur: 0.3, type: "triangle", vol: 0.15 });
      tone({ freq: 1760, dur: 0.22, type: "sine", vol: 0.09, delay: 0.02 });
      noiseBurst({ dur: 0.16, f0: 4200, f1: 1800, q: 2.4, vol: 0.11 });
    },
    win: function () {
      [523, 659, 784, 1046].forEach(function (f, i) {
        tone({ freq: f, dur: 0.34, type: "triangle", vol: 0.13, delay: i * 0.13 });
      });
    },
    lose: function () {
      [392, 330, 262, 196].forEach(function (f, i) {
        tone({ freq: f, dur: 0.4, type: "sawtooth", vol: 0.11, delay: i * 0.16 });
      });
    }
  };

  /* ====================== 小人与界面状态 ====================== */
  /* 英雄换到某一段（上 / 中 / 下） */
  function setLane(zone) {
    rise.style.setProperty("--lane", (LANE_Y[zone] * oneThird()) + "px");
  }
  function setMidLane() { rise.style.setProperty("--lane", "0px"); }

  /* 全身冲刺攻击 */
  function dashTo(dx, dy) {
    rise.style.setProperty("--dx", dx + "px");
    rise.style.setProperty("--dy", dy + "px");
    rise.classList.remove("dash");
    void rise.offsetWidth;
    rise.classList.add("dash");
    setTimeout(function () { rise.classList.remove("dash"); }, 820);
  }
  /* 举盾防守 / 收盾 */
  function guardOn() {
    rise.classList.remove("guard");
    void rise.offsetWidth;
    rise.classList.add("guard");
  }
  function guardOff() { rise.classList.remove("guard"); }
  /* 英雄被击中 */
  function hurtHero() {
    rise.classList.remove("hurt");
    void rise.offsetWidth;
    rise.classList.add("hurt");
    setTimeout(function () { rise.classList.remove("hurt"); }, 720);
  }
  /* 大魔王俯冲 / 被击中 */
  function diveBoss(dx, dy) {
    bossFrame.style.setProperty("--dx", dx + "px");
    bossFrame.style.setProperty("--dy", dy + "px");
    bossFrame.classList.remove("dive");
    void bossFrame.offsetWidth;
    bossFrame.classList.add("dive");
    setTimeout(function () { bossFrame.classList.remove("dive"); }, 800);
  }
  function hurtBoss() {
    bossFrame.classList.remove("hurt");
    void bossFrame.offsetWidth;
    bossFrame.classList.add("hurt");
    setTimeout(function () { bossFrame.classList.remove("hurt"); }, 680);
  }
  /* 血条 */
  function hpClass(box, hp) {
    box.classList.toggle("warn", hp <= MAX_HP * 0.5 && hp > MAX_HP * 0.2);
    box.classList.toggle("crit", hp <= MAX_HP * 0.2);
  }
  function renderHp() {
    var b = Math.max(0, state.bossHp), h = Math.max(0, state.heroHp);
    bossHpFill.style.width = (b / MAX_HP * 100) + "%";
    bossHpText.textContent = b;
    hpClass(bossHp, b);
    heroHpFill.style.width = (h / MAX_HP * 100) + "%";
    heroHpText.textContent = h;
    hpClass(heroHp, h);
  }
  function damage(side, amount) {
    if (side === "boss") { state.bossHp = Math.max(0, state.bossHp - amount); }
    else { state.heroHp = Math.max(0, state.heroHp - amount); }
    renderHp();
  }
  /* 选择键：需要时出现，动画时收起 */
  function showChoices(mode) {
    choiceBtns.forEach(function (b) {
      b.classList.toggle("atk", mode === "atk");
      b.classList.toggle("def", mode === "def");
      var em = b.querySelector("em");
      if (em) em.textContent = (mode === "atk") ? "⚔️" : "🛡️";
    });
    hintIco.textContent = (mode === "atk") ? "⚔️" : "🛡️";
    hintText.textContent = (mode === "atk") ? "选择攻击位置" : "选择防守位置";
    hint.classList.toggle("atk", mode === "atk");
    hint.classList.toggle("def", mode === "def");
    choices.classList.add("show");
    hint.classList.add("show");
  }
  function hideChoices() {
    choices.classList.remove("show");
    hint.classList.remove("show");
  }
  /* ======================================================================
     你的回合：英雄全身冲刺 → 砍向大魔王的那一段
     ====================================================================== */
  async function playerAttack(zone) {
    state.busy = true;
    hideChoices();                      // 动画开始，选择键收起
    var bossZone = pick();              // 大魔王随机防守一段
    setLane(zone);                      // 英雄先站到要攻击的那一段
    await wait(240);

    var from = centerOf(rise);
    var to = centerOf(laneEl("boss", zone));
    trail(from, to, false);
    dashTo(to.x - from.x, to.y - from.y);   // 全身冲上去
    sfx.whoosh();
    await wait(350);                    // 冲到最高点的一瞬

    var blocked = (zone === bossZone);
    var impact = centerOf(laneEl("boss", zone));
    var defPt = centerOf(laneEl("boss", bossZone));
    shieldAt(defPt, blocked);           // 盾牌出现在大魔王防守的那一段

    if (blocked) {
      markLane(laneEl("boss", zone), "blocked");
      sfx.block();
      popAt(defPt, "格挡！", "0 伤害", "block");
      flashScreen("block", "top");
    } else {
      markLane(laneEl("boss", zone), "hit");
      sfx.hit();
      slashAt(impact, true);
      sparksAt(impact, true, 14);
      burstAt(impact);
      popAt(impact, "命中！", "-" + DMG + " HP", "hit");
      dmgAt(impact, "-" + DMG);
      hurtBoss();
      damage("boss", DMG);
      flashScreen("hit", "top");
      state.hits++;
    }
    await wait(430);

    if (state.bossHp <= 0) { endGame(true); return; }

    setMidLane();                       // 英雄落回中场
    state.plan = pick();                // 大魔王准备攻击
    state.phase = "defend";
    bossFrame.classList.add("charging");
    showAim(state.plan);                // 亮出攻击方向
    await wait(250);
    showChoices("def");                 // 轮到你防守
    state.busy = false;
  }

  /* ======================================================================
     大魔王回合：英雄全身滑到那一段举盾、被撞飞
     ====================================================================== */
  async function playerDefend(zone) {
    state.busy = true;
    hideChoices();
    clearAim();
    bossFrame.classList.remove("charging");
    var bossZone = state.plan;

    setLane(zone);                      // 英雄移到要防守的那一段
    await wait(250);
    guardOn();                          // 蹲下举盾
    await wait(150);

    var from = centerOf(bossFrame);
    var to = centerOf(laneEl("hero", bossZone));
    trail(from, to, true);              // 红色残影冲向英雄那一段
    diveBoss(to.x - from.x, to.y - from.y);
    sfx.whoosh();
    await wait(350);

    var blocked = (zone === bossZone);
    var impact = centerOf(laneEl("hero", bossZone));
    if (blocked) {
      markLane(laneEl("hero", zone), "blocked");
      sfx.block();
      popAt(impact, "格挡！", "0 伤害", "block");
      flashScreen("block", "bottom");
      state.blocks++;
    } else {
      markLane(laneEl("hero", bossZone), "hit");
      markLane(laneEl("hero", zone), "ping");
      shieldAt(centerOf(laneEl("hero", zone)), false);   // 盾举错了方向
      sfx.hit();
      slashAt(impact, true);
      sparksAt(impact, true, 12);
      burstAt(impact);
      popAt(impact, "命中！", "-" + DMG + " HP", "hit");
      dmgAt(impact, "-" + DMG);
      hurtHero();
      damage("hero", DMG);
      flashScreen("hit", "bottom");
    }
    await wait(470);

    guardOff();
    setMidLane();

    if (state.heroHp <= 0) { endGame(false); return; }

    state.round++;
    state.phase = "attack";
    await wait(230);
    showChoices("atk");                 // 又轮到你出招
    state.busy = false;
  }

  /* ======================================================================
     结算 / 重开
     ====================================================================== */
  function endGame(win) {
    state.phase = "over";
    state.busy = true;
    hideChoices();
    clearAim();
    bossFrame.classList.remove("charging");
    rise.classList.remove("dash", "guard", "hurt");
    if (win) {
      resEmoji.textContent = "🏆";
      resTitle.textContent = "你赢了！";
      resTitle.className = "win";
      resSub.textContent = "大魔王被打回相册 —— 共 " + state.round + " 回合，命中 " +
        state.hits + " 次，格挡 " + state.blocks + " 次。";
      sfx.win();
      confetti();
    } else {
      resEmoji.textContent = "💀";
      resTitle.textContent = "你输了！";
      resTitle.className = "lose";
      resSub.textContent = "英雄倒下了 —— 共 " + state.round + " 回合，命中 " +
        state.hits + " 次，格挡 " + state.blocks + " 次。";
      sfx.lose();
    }
    setTimeout(function () { resultOverlay.classList.add("show"); }, 720);
  }
  function confetti() {
    var colors = ["#57e6ff", "#ffd166", "#ff4d8d", "#6ef2a4", "#a06bff", "#ffffff"];
    for (var i = 0; i < 60; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.left = (Math.random() * 100) + "%";
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.width = (6 + Math.random() * 8) + "px";
      c.style.height = (9 + Math.random() * 10) + "px";
      c.style.animationDuration = (2.2 + Math.random() * 2) + "s";
      c.style.animationDelay = (Math.random() * 0.8) + "s";
      resultOverlay.appendChild(c);
      (function (el) {
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 6000);
      })(c);
    }
  }
  function reset() {
    state.bossHp = MAX_HP;
    state.heroHp = MAX_HP;
    state.round = 1;
    state.hits = 0;
    state.blocks = 0;
    state.busy = false;
    state.phase = "attack";
    state.started = true;
    clearAim();
    bossFrame.classList.remove("charging", "hurt", "dive");
    rise.className = "rise idle";
    rise.style.setProperty("--lane", "0px");
    fxLayer.innerHTML = "";
    renderHp();
    showChoices("atk");
  }
  /* ======================================================================
     照片
     ====================================================================== */
  /* iPhone 上「点了没反应」的三个原因，这里逐个堵住：
     1) 不能只靠 MIME 判断 —— 从「照片」选图时 file.type 有时是空字符串，
        旧代码直接 return，看起来就是完全没反应；改成按扩展名兜底 + 真正解码验证。
     2) HEIC / 超大图可能解不出来 —— 等 Image 真的 onload 才算成功，失败要有可见提示。
     3) input.value 不清空，连续选同一张照片不会再触发 change。 */
  var photoMsgEl = $("photoMsg"), msgTimer = null;
  function photoMsg(text) {
    clearTimeout(msgTimer);
    if (!text) { photoMsgEl.hidden = true; photoMsgEl.textContent = ""; return; }
    photoMsgEl.hidden = false;
    photoMsgEl.textContent = text;
    msgTimer = setTimeout(function () { photoMsgEl.hidden = true; }, 6000);
  }

  function loadPhoto(file) {
    if (!file) return;
    var name = file.name || "photo";
    var looksImage = !file.type ||
      /^image\//.test(file.type) ||
      /\.(jpe?g|png|gif|webp|heic|heif|bmp|avif)$/i.test(name);
    if (!looksImage) { photoMsg("这不是图片文件，换一张试试"); return; }

    if (state.photoURL) { try { URL.revokeObjectURL(state.photoURL); } catch (e) {} }
    var url = URL.createObjectURL(file);
    var probe = new Image();
    probe.onload = function () {
      state.photoURL = url;
      bossImg.onerror = function () { photoMsg("这张照片解码失败，换一张 JPG 试试"); };
      bossImg.src = url;
      bossImg.style.display = "block";
      bossFallback.classList.add("hidden");
      previewImg.src = url;
      previewName.textContent = name;
      preview.classList.add("show");
      btnStart.disabled = false;
      btnStart.textContent = (state.started && state.phase !== "over") ? "换好了，继续" : "开始战斗";
      photoMsg("");
      sfx.click();
    };
    probe.onerror = function () {
      try { URL.revokeObjectURL(url); } catch (e) {}
      photoMsg("iPhone 打不开这张照片（可能是 HEIC），请截图后再选，或换一张 JPG");
    };
    probe.src = url;
  }
  function useDefaultBoss() {
    if (state.photoURL) { try { URL.revokeObjectURL(state.photoURL); } catch (e) {} }
    state.photoURL = null;
    bossImg.removeAttribute("src");
    bossImg.style.display = "none";
    bossFallback.classList.remove("hidden");
  }

  /* ======================================================================
     交互
     ====================================================================== */
  function ready() {
    return !state.busy && state.phase !== "idle" && state.phase !== "over";
  }
  function cast(zone) {
    sfx.click();
    if (state.phase === "attack") { playerAttack(zone); }
    else if (state.phase === "defend") { playerDefend(zone); }
  }

  choices.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest(".choice") : null;
    if (!btn || !ready()) return;
    cast(btn.getAttribute("data-zone"));
  });

  /* 键盘 1 / 2 / 3 */
  document.addEventListener("keydown", function (e) {
    var map = { "1": "top", "2": "mid", "3": "bot" };
    var zone = map[e.key];
    if (!zone || !ready()) return;
    e.preventDefault();
    cast(zone);
  });

  /* 选照片 */
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) loadPhoto(fileInput.files[0]);
    fileInput.value = "";               // 允许再次选择同一张照片
  });
  ["dragenter", "dragover"].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault(); e.stopPropagation();
      dropZone.classList.add("drag");
    });
  });
  ["dragleave", "dragend"].forEach(function (ev) {
    dropZone.addEventListener(ev, function (e) {
      e.preventDefault();
      dropZone.classList.remove("drag");
    });
  });
  dropZone.addEventListener("drop", function (e) {
    e.preventDefault(); e.stopPropagation();
    dropZone.classList.remove("drag");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadPhoto(f);
  });
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault();
    if (!uploadOverlay.classList.contains("show")) return;
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) loadPhoto(f);
  });

  /* 按钮 */
  btnStart.addEventListener("click", function () {
    sfx.click();
    uploadOverlay.classList.remove("show");
    if (!state.started || state.phase === "over") reset();
  });
  btnDefault.addEventListener("click", function () {
    useDefaultBoss();
    uploadOverlay.classList.remove("show");
    if (!state.started || state.phase === "over") reset();
  });
  btnPhoto.addEventListener("click", function () {
    sfx.click();
    uploadOverlay.classList.add("show");
  });
  btnSound.addEventListener("click", function () {
    state.sound = !state.sound;
    btnSound.textContent = state.sound ? "🔊" : "🔇";
    if (state.sound) sfx.click();
  });
  btnAgain.addEventListener("click", function () {
    sfx.click();
    resultOverlay.classList.remove("show");
    reset();
  });
  btnChange.addEventListener("click", function () {
    sfx.click();
    resultOverlay.classList.remove("show");
    uploadOverlay.classList.add("show");
  });

  /* 屏幕尺寸变化时清掉残留特效 */
  window.addEventListener("resize", function () {
    if (!state.busy) fxLayer.innerHTML = "";
  });

  /* ======================================================================
     初始化
     ====================================================================== */
  renderHp();
  hideChoices();
})();
</script>
</body>
</html>
